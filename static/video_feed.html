<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Judge</title>
    <link href="styles.css" rel="stylesheet">
    <style>
        /* Custom scrollbar for the sidebar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#000] text-white font-google-sans-text antialiased overflow-hidden">
    <div id="menu-div" class="absolute pl-2 top-0 left-0 h-12 pt-1 w-12 bg-[#1e1f20] z-50 overflow-y-auto">
        <button id="menu-btn" class="p-2 rounded-md hover:bg-gray-600 transition-colors focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-4 h-4 text-white">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </button>
    </div>
    
    <div id="side-stripe" class="fixed top-12 left-0 h-full w-12 bg-[#1e1f20] z-30 overflow-y-auto"></div>
    
    <div id="sidebar" class="fixed top-0 left-0 h-full pt-12 w-44 bg-[#1e1f20] transform -translate-x-full transition-transform duration-300 ease-in-out z-40 overflow-y-auto">
    	<div class="p-4">
        	<h3 class="text-[12px] font-semibold mb-4 uppercase tracking-wider text-gray-400">Previous Lifts</h3>
		<ol id="video-list" class="space-y-2 list-none"></ol>
    	</div>
    </div>

    <main id="main-content" class="transition-all duration-300 ease-in-out relative pt-0 pb-12 pl-14 px-2 flex flex-col items-center h-screen w-full">

        <div id="banner" class="relative w-full h-12 bg-[#000] z-50 flex items-center justify-center px-4">
            <div class="flex items-center gap-4">
                <span class="text-md font-semibold tracking-tight">Lift<span class="text-red-700">Judge</span></span>
            </div>

        </div>

	<div 
  	id="status-warning" 
  	class="hidden mt-4 flex items-center p-4 mb-4 text-amber-800 border-t-4 border-amber-300 bg-amber-50" 
  	role="alert">
		<svg class="flex-shrink-0 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
			<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
    		</svg>
    
    		<div id="warning-text" class="ml-3 text-sm font-medium">
			Feature is currently in use. Please try again shortly.
    		</div>

    		<button onclick="this.parentElement.classList.add('hidden')"
      			class="ml-auto -mx-1.5 -my-1.5 bg-amber-50 text-amber-500 rounded-lg focus:ring-2 focus:ring-amber-400 p-1.5 hover:bg-amber-200 inline-flex h-8 w-8 transition">
        		<span class="sr-only">Dismiss</span>
        		<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
    		</button>
	</div>

        <div class="relative max-w-2xl aspect-square bg-black rounded-2xl overflow-hidden shadow-2xl border border-[#1e1f20] group ring-1 ring-white/10">
            
	    <div id="video-container">
    		<img id="video-feed" width="640" height="640" alt="Live Video Feed" style="transform: scaleX(-1);">
	    </div>

            <div class="absolute bottom-0 left-0 right-0 h-20 flex items-end pb-6 px-6">
                <div class="w-full flex justify-between items-center">
                    
                    <div class="flex items-center gap-6">
			<form id="play-pause-form">
			    <button type="submit" id="play-pause-btn" class="text-white hover:text-red-500 transition-colors">
    				<svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
        				<path id="btn-path" fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" />
    				</svg>
			    </button>
			</form>

                    </div>

                    <div class="flex items-center gap-4">
                    </div>
                </div>
	    </div>
        </div>
        <div class="relative max-w-2xl bg-black rounded-2xl">
			<form id="video-save-form" class="flex flex-col space-y-4 pt-4">
    			<div class="grid grid-cols-[auto_1fr] gap-4 items-center">
				<label for="lifttype" class="text-right">Select the lift type before beginning recording:</label>
				<select id="lifttype" name="lifttype" required class="text-black bg-white px-2 py-1 rounded">
  					<option value="squat">Squat</option>
  					<option value="deadlift">Deadlift</option>
				</select>
    			</div>
			</form>
        </div>
    </main>

    <script src="/auth.js"></script>
    <script>
	
        const menuBtn = document.getElementById('menu-btn');
        const menuDiv = document.getElementById('menu-div');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const sideStripe = document.getElementById('side-stripe');
        const banner = document.getElementById('banner');
	
	if (window.matchMedia("(max-width: 768px)").matches) {
		sideStripe.classList.add('-translate-x-full')
		mainContent.classList.remove('pl-14')
		banner.classList.remove('w-full')
		banner.classList.add('pl-12')
		menuBtn.classList.remove('fixed')
		menuBtn.classList.add('relative')
		menuDiv.classList.add('rounded-2xl')
	}

        menuBtn.addEventListener('click', () => {
            const isCollapsed = sidebar.classList.contains('-translate-x-full');

            if (isCollapsed) {
                // EXPANDING
                sidebar.classList.remove('-translate-x-full');
                mainContent.classList.remove('pl-14');
                mainContent.classList.add('pl-44');
            } else {
                // COLLAPSING
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('pl-44');
		if (!window.matchMedia("(max-width: 768px)").matches) {
                	mainContent.classList.add('pl-14');
		}
            }
        });
	const playBtn = document.getElementById('play-pause-btn');
	const playForm = document.getElementById('play-pause-form');
	const btnPath = document.getElementById('btn-path');
	const pausePath = "M6.75 5.25a.75.75 0 0 1 .75.75v12a.75.75 0 0 1-1.5 0v-12a.75.75 0 0 1 .75-.75Zm9 0a.75.75 0 0 1 .75.75v12a.75.75 0 0 1-1.5 0v-12a.75.75 0 0 1 .75-.75Z";
	const playPath = "M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653Z";
	
	document.addEventListener('DOMContentLoaded', () => {
		getLiveVideo();
	});
	
	function displayWarning(msg) {
		const warningBox = document.getElementById('status-warning');
  		warningBox.textContent = msg;
  		warningBox.style.display = 'block'; // Reveal the hidden div
	}
	let isPlaying = false;
	playForm.addEventListener('submit', async () => {
		event.preventDefault();
    		const endpoint = isPlaying ? '/api/stop_recording' : '/api/start_recording';
		const warningBox = document.getElementById('status-warning');
  		const warningText = document.getElementById('warning-text');
    		try {
			const res = await (isPlaying ? stopRecording() : startRecording());
			console.log(res)
			if (res.ok) {
        			isPlaying = !isPlaying;
        			if (isPlaying) {
            				btnPath.setAttribute('d', pausePath); // Switch to Pause Icon
        			} else {
            				btnPath.setAttribute('d', playPath);  // Switch to Play Icon
					window.location.href = '/view_tmp_recording.html';
        			}
				warningBox.classList.add('hidden');
			}
			if (res.status === 409) {
				const data = await res.json();
				warningText.textContent = data.message || "Someone else is using this feature right now.";
      				warningBox.classList.remove('hidden'); 
      				return;
			}
    		} catch (error) {
        		console.error("Failed to communicate with the recording server:", error);
    		}
	});
	
	loadVideoHistory();

    </script>
</body>
</html>
