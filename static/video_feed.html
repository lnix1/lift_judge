<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Judge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the sidebar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#000] text-white font-google-sans-text antialiased overflow-hidden">
    <div class="absolute pl-2 top-0 left-0 h-12 pt-1 w-12 bg-[#1e1f20] z-50 overflow-y-auto">
        <button id="menu-btn" class="p-2 rounded-md hover:bg-gray-600 transition-colors focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-4 h-4 text-white">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </button>
    </div>
    <div id="side-stripe" class="fixed top-12 left-0 h-full w-12 bg-[#1e1f20] z-30 overflow-y-auto"></div>
    <div id="sidebar" class="fixed top-0 left-0 h-full pt-12 w-44 bg-[#1e1f20] transform -translate-x-full transition-transform duration-300 ease-in-out z-40 overflow-y-auto">
        <div class="p-4">
            <h3 class="text-[12px] font-semibold">Previous Lifts</h3>
            
            <ul id="video-list" class="space-y-2">
                <li>
                    <a href="#" class="block px-4 py-1 rounded-lg hover:bg-gray-600 transition-colors border border-transparent hover:border-slate-800">
                        <div class="text-[12px]">Louis - 01/20/2026 10:00 AM</div>
                        <div class="text-[12px] text-gray-500">Deadlift</div>
                    </a>
                </li>
                <li>
                    <a href="#" class="block px-4 py-1 rounded-lg hover:bg-gray-600 transition-colors border border-transparent hover:border-slate-800">
                        <div class="text-[12px]">Louis - 01/20/2026 9:00 AM</div>
                        <div class="text-[12px] text-gray-500">Squat</div>
                    </a>
                </li>
                <li>
                    <a href="#" class="block px-4 py-1 rounded-lg hover:bg-gray-600 transition-colors border border-transparent hover:border-slate-800">
                        <div class="text-[12px]">Louis - 01/20/2026 8:00 AM</div>
                        <div class="text-[12px] text-gray-500">Bench</div>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <main id="main-content" class="transition-all duration-300 ease-in-out relative pt-0 pb-12 pl-14 px-2 flex flex-col items-center h-screen w-full">

        <div id="banner" class="relative w-full h-12 bg-[#000] z-50 flex items-center justify-center px-4">
            <div class="flex items-center gap-4">
                <span class="text-md font-semibold tracking-tight">Lift<span class="text-red-700">Judge</span></span>
            </div>

        </div>

        <div class="relative max-w-2xl aspect-square bg-black rounded-2xl overflow-hidden shadow-2xl border border-[#1e1f20] group ring-1 ring-white/10">
            
	    <div id="video-container">
    		<img id="video-feed" width="640" height="640" alt="Live Video Feed" style="transform: scaleX(-1);">
	    </div>

            <div class="absolute bottom-0 left-0 right-0 h-20 flex items-end pb-6 px-6">
                <div class="w-full flex justify-between items-center">
                    
                    <div class="flex items-center gap-6">
			<form action="/start_recording" method="POST">
			    <button type="submit" id="play-pause-btn" class="text-white hover:text-pink-500 transition-colors">
    				<svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
        				<path id="btn-path" fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" />
    				</svg>
			    </button>
			</form>

                    </div>

                    <div class="flex items-center gap-4">
                    </div>
                </div>
	    </div>
        </div>
    </main>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const sideStripe = document.getElementById('side-stripe');
        const banner = document.getElementById('banner');
	
	if (window.matchMedia("(max-width: 768px)").matches) {
		sideStripe.classList.add('-translate-x-full')
		mainContent.classList.remove('pl-14')
		banner.classList.remove('w-full')
		banner.classList.add('pl-12')
		menuBtn.classList.remove('fixed')
		menuBtn.classList.add('relative')
	}

        menuBtn.addEventListener('click', () => {
            const isCollapsed = sidebar.classList.contains('-translate-x-full');

            if (isCollapsed) {
                // EXPANDING
                sidebar.classList.remove('-translate-x-full');
                mainContent.classList.remove('pl-14');
                mainContent.classList.add('pl-44');
            } else {
                // COLLAPSING
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('pl-44');
		if (!window.matchMedia("(max-width: 768px)").matches) {
                	mainContent.classList.add('pl-14');
		}
            }
        });
	
	const playBtn = document.getElementById('play-pause-btn');
	const btnPath = document.getElementById('btn-path');
	const pausePath = "M6.75 5.25a.75.75 0 0 1 .75.75v12a.75.75 0 0 1-1.5 0v-12a.75.75 0 0 1 .75-.75Zm9 0a.75.75 0 0 1 .75.75v12a.75.75 0 0 1-1.5 0v-12a.75.75 0 0 1 .75-.75Z";
	const playPath = "M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653Z";

	let isPlaying = false;
	
	playBtn.addEventListener('click', async () => {
    		// 1. Determine which endpoint to hit based on current state
    		const endpoint = isPlaying ? '/stop_recording' : '/start_recording';

    		try {
        		await fetch(endpoint, {
            			method: 'POST'
        		});

        		isPlaying = !isPlaying;

        		if (isPlaying) {
            			btnPath.setAttribute('d', pausePath); // Switch to Pause Icon
            			videoElement.play();
        		} else {
            			btnPath.setAttribute('d', playPath);  // Switch to Play Icon
            			videoElement.pause();
        		}
    		} catch (error) {
        		console.error("Failed to communicate with the recording server:", error);
    		}
	});

	document.addEventListener('DOMContentLoaded', () => {
    	const token = localStorage.getItem('liftjudge_token');
		console.log("Retrieved token from storage:", token); // Is this null?
    		const videoElement = document.getElementById('video-feed');
    
    		if (token) {
        		videoElement.src = `/api/video_feed?access_token=${token}`;
    		} else {
        		console.error("User not logged in");
        		window.location.href = "/";
    		}
	});

    </script>
</body>
</html>
