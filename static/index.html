<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Judge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the sidebar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans antialiased overflow-hidden">

    <nav class="fixed top-0 left-0 right-0 h-16 bg-slate-950 border-b border-slate-800 z-50 flex items-center justify-between px-6 shadow-lg">
        <div class="flex items-center gap-4">
            <span class="text-xl font-bold tracking-tight text-slate-100">Lift<span class="text-gray-700">Judge</span></span>
        </div>


        <div class="flex items-center gap-4">
            <button class="rounded-full overflow-hidden border-2 border-slate-700 hover:border-slate-500 transition-all">
                <img src="https://i.pravatar.cc/150?img=11" alt="User Profile" class="w-8 h-8 object-cover">
            </button>
        </div>
    </nav>

    <aside class="fixed top-16 left-0 h-[calc(100vh-4rem)] w-64 bg-slate-950 border-r border-slate-800 z-40 overflow-y-auto">
        <div class="p-4">
            <h3 class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-4">Previous Lifts</h3>
            
            <ul id="video-list" class="space-y-2">
                <li>
                    <a href="#" class="block px-4 py-3 rounded-lg hover:bg-slate-900 transition-colors border border-transparent hover:border-slate-800">
                        <div class="text-sm font-medium text-slate-200">Louis - 01/20/2026 10:00 AM</div>
                        <div class="text-xs text-slate-500">Deadlift</div>
                    </a>
                </li>
                <li>
                    <a href="#" class="block px-4 py-3 rounded-lg hover:bg-slate-900 transition-colors border border-transparent hover:border-slate-800">
                        <div class="text-sm font-medium text-slate-300">Louis - 01/20/2026 9:00 AM</div>
                        <div class="text-xs text-slate-500">Squat</div>
                    </a>
                </li>
                <li>
                    <a href="#" class="block px-4 py-3 rounded-lg hover:bg-slate-900 transition-colors border border-transparent hover:border-slate-800">
                        <div class="text-sm font-medium text-slate-300">Louis - 01/20/2026 8:00 AM</div>
                        <div class="text-xs text-slate-500">Bench</div>
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <main class="relative pt-24 pb-12 pl-64 px-12 flex flex-col items-center h-screen w-full">
        <div class="flex items-center gap-4 pb-6">
            <span class="text-3xl font-bold tracking-tight text-slate-100">Live Stream</span></span>
        </div>
        
        <div class="relative w-80% max-w-2xl aspect-square bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 group ring-1 ring-white/10">
            
            <!--<img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop" 
                 class="w-full h-full object-cover opacity-90" 
		 alt="Live Stream Placeholder"> -->
	    
	    <div id="video-container">
    		<img src="/video_feed" width="640" height="640" alt="Live Video Feed" style="transform: scaleX(-1);">
	    </div>

            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/20 pointer-events-none"></div>

            <div class="absolute bottom-0 left-0 right-0 h-20 bg-gradient-to-t from-black/90 to-transparent flex items-end pb-6 px-6 backdrop-blur-[2px]">
                <div class="w-full flex justify-between items-center">
                    
                    <div class="flex items-center gap-6">
                        <button class="text-white hover:text-slate-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                                <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" />
                            </svg>
                        </button>

                        <button class="text-white hover:text-slate-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                                <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.805l-.07.232a6.418 6.418 0 0 0 0 3.868l.07.232c.342 1.14 1.518 1.805 2.659 1.805h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 1 1-1.06-1.06 2.476 2.476 0 0 0 0-3.502.75.75 0 0 1 1.06-1.061 3.976 3.976 0 0 0 0-5.625.75.75 0 0 1 1.06-1.06Z" />
                            </svg>
                        </button>

                        <div class="flex items-center gap-2">
                            <span class="relative flex h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                            </span>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Javascript is much simpler now as UI toggling is removed.
        // Left here for your future fetch logic.
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("Simulating fetch request for video links...");

            // const data = await response.json();
            // populateList(data);
        });
    </script>
</body>
</html>
