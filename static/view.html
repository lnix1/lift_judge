<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Judge</title>
    <link href="/styles.css" rel="stylesheet">
    <style>
        /* Custom scrollbar for the sidebar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#000] text-white font-google-sans-text antialiased">
    <div id="menu-div" class="absolute pl-2 top-0 left-0 h-12 pt-1 w-12 bg-[#1e1f20] z-50 overflow-y-auto">
        <button id="menu-btn" class="p-2 rounded-md hover:bg-gray-600 transition-colors focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-4 h-4 text-white">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </button>
    </div>
    <div id="side-stripe" class="fixed top-12 left-0 h-full w-12 bg-[#1e1f20] z-30 overflow-y-auto"></div>
    <div id="sidebar" class="fixed top-0 left-0 h-full pt-12 w-44 bg-[#1e1f20] transform -translate-x-full transition-transform duration-300 ease-in-out z-40 overflow-y-auto">
    	<div class="p-4">
        	<h3 class="text-[12px] font-semibold mb-4 uppercase tracking-wider text-gray-400">Previous Lifts</h3>
		<ol id="video-list" class="space-y-2 list-none"></ol>
    	</div>
    </div>

    <main id="main-content" class="transition-all duration-300 ease-in-out relative pt-0 pb-12 pl-14 px-2 flex flex-col items-center h-screen w-full">

        <div id="banner" class="relative w-full h-12 bg-[#000] z-50 flex items-center justify-center px-4">
            <div class="flex items-center gap-4">
                <span class="text-md font-semibold tracking-tight">Lift<span class="text-red-700">Judge</span></span>
            </div>

        </div>

        <div class="relative max-w-2xl aspect-square bg-black rounded-2xl overflow-hidden shadow-2xl border border-[#1e1f20] group ring-1 ring-white/10">
            
	    <div id="video-container">
    		<video id="main-player" width="640" height="640" controls autoplay>
    		</video>
	    </div>
	</div>
        
	<div class="relative max-w-2xl bg-black rounded-2xl">
		<p id="liftresult"></p>
        </div>
	<div class="relative max-w-2xl bg-black rounded-2xl">
			<form id="video-delete-form" class="flex flex-col space-y-4 pt-4">
    			<button type="submit" class="bg-white/10 hover:bg-red-700 text-white py-2 px-4 rounded transition">Delete Lift</button>
			</form>
        </div>
	
	<div>
    		<a href="/video_feed.html" class="button text-center text-sm text-gray-400 hover:text-white">Record another lift</a>
	</div>

    </main>

    <script src="/auth.js"></script>
    <script>
	
        const menuBtn = document.getElementById('menu-btn');
        const menuDiv = document.getElementById('menu-div');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const sideStripe = document.getElementById('side-stripe');
        const banner = document.getElementById('banner');
	
	if (window.matchMedia("(max-width: 768px)").matches) {
		sideStripe.classList.add('-translate-x-full')
		mainContent.classList.remove('pl-14')
		banner.classList.remove('w-full')
		banner.classList.add('pl-12')
		menuBtn.classList.remove('fixed')
		menuBtn.classList.add('relative')
		menuDiv.classList.add('rounded-2xl')
	}

        menuBtn.addEventListener('click', () => {
            const isCollapsed = sidebar.classList.contains('-translate-x-full');

            if (isCollapsed) {
                // EXPANDING
                sidebar.classList.remove('-translate-x-full');
                mainContent.classList.remove('pl-14');
                mainContent.classList.add('pl-44');
            } else {
                // COLLAPSING
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('pl-44');
		if (!window.matchMedia("(max-width: 768px)").matches) {
                	mainContent.classList.add('pl-14');
		}
            }
        });
	
	loadVideoHistory();
	
	const pathParts = window.location.pathname.split('/');
	const videoId = pathParts[pathParts.length - 1];
	const player = document.getElementById('main-player');

	async function loadLiftResult(videoId) {
		if (videoId) {
			player.src = `/api/user/video/${videoId}`;
			try {
				const response = await authFetch(`/api/user/video/${videoId}/result`);
       		 		if (!response.ok) throw new Error('Failed to fetch lift result');
			        const liftResult = await response.json(); 
			        console.log(liftResult.result);
				if (liftResult.result == "true") {
					document.getElementById('liftresult').innerHTML = `<strong style="color: green;">Lift Good</strong>`;
				} else {
					document.getElementById('liftresult').innerHTML = `<strong style="color: red;">Lift Failed</strong>`;
				}
			} catch (error) {
        			console.error("Error loading lift result:", error);
			}
		} else {
			console.error("No video ID found in URL");
		}
	};
	loadLiftResult(videoId);
	
	const videoDeleteForm = document.getElementById('video-delete-form');

	videoDeleteForm.addEventListener('submit', async (e) => {
    		e.preventDefault();
    
		const response = await authFetch(`/api/user/video/delete/${videoId}`, {
        		method: 'POST',
    		});

		if (response.ok) {
    			window.location.href = '/video_feed.html';
		}
	});

    </script>
</body>
</html>
