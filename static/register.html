<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Judge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the sidebar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#000] text-white font-google-sans-text antialiased overflow-hidden">

    <main id="main-content" class="transition-all duration-300 ease-in-out relative pt-0 pb-12 px-0 flex flex-col items-center h-screen w-full">

        <div class="relative w-full h-12 bg-[#000] z-50 flex items-center justify-between px-4">
            <div class="flex items-center gap-4">
                <span class="text-md font-semibold tracking-tight">Lift<span class="text-red-700">Judge</span></span>
            </div>

        </div>

        <div class="relative max-w-2xl aspect-square bg-black rounded-2xl overflow-hidden shadow-2xl">
		<form id="register-form" method="POST" class="flex flex-col space-y-4 pt-4">
    		<div class="grid grid-cols-[auto_1fr] gap-4 items-center">
        		<label for="email" class="text-right">Email:</label>
        		<input type="text" id="email" name="email" autocomplete="email" required class="w-full text-black px-2 py-1 rounded">

        		<label for="password" class="text-right">Password:</label>
        		<input type="password" id="password" name="password" autocomplete="current-password" required class="w-full text-black px-2 py-1 rounded">
    		</div>

    		<button type="submit" class="bg-white/10 hover:bg-white/20 text-white py-2 px-4 rounded transition">Register</button>
    		<a href="/" class="button text-center text-sm text-gray-400 hover:text-white">Or click here to create an account</a>
		</form>
        </div>
    </main>

    <script>
	const registerForm = document.getElementById('register-form');

	registerForm.addEventListener('submit', async (e) => {
    		e.preventDefault(); // Stop the browser from submitting the form conventionally
    
    		const email = registerForm.email.value;
    		const password = registerForm.password.value;

    		const response = await fetch('/api/users', {
        		method: 'POST',
        		body: JSON.stringify({ email, password })
    		});

		if (response.ok) {
    			//const data = await response.json();
			//console.log("created token with value: ", data.token)
    			//localStorage.setItem('liftjudge_token', data.token); 
    			window.location.href = '/';
		} else {
			window.location.href = '/register.html'
		}
	});
    </script>
</body>
</html>
