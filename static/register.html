<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Judge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the sidebar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#000] text-white font-google-sans-text antialiased overflow-hidden">

    <main id="main-content" class="transition-all duration-300 ease-in-out relative pt-0 pb-12 px-0 flex flex-col items-center h-screen w-full">

        <div class="relative w-full h-12 bg-[#000] z-50 flex items-center justify-between px-4">
            <div class="flex items-center gap-4">
                <span class="text-md font-semibold tracking-tight">Lift<span class="text-red-700">Judge</span></span>
            </div>

        </div>

        <div class="relative max-w-2xl aspect-square bg-black rounded-2xl overflow-hidden shadow-2xl border border-[#1e1f20] group ring-1 ring-white/10">
		<form id="register-form" action="/api/users" method="POST">
    				<div>
        				<label for="username">Username:</label>
        				<input type="text" id="username" name="username" autocomplete="username" required>
    				</div>
    				<div>
        				<label for="password">Password:</label>
        				<input type="password" id="password" name="password" autocomplete="current-password" required>
    				</div>
    			<button type="submit">Create Account</button>
			<br>
			<a href="/" class="button">Or click here if you already have an account</a>
		</form>
        </div>
    </main>

    <script>
	const loginForm = document.getElementById('register-form');

	loginForm.addEventListener('submit', async (e) => {
    		e.preventDefault(); // Stop the browser from submitting the form conventionally
    
    		const email = loginForm.username.value;
    		const password = loginForm.password.value;

    		const response = await fetch('/api/users', {
        		method: 'POST',
        		body: JSON.stringify({ email, password })
    		});

		if (response.ok) {
    			const data = await response.json();
    			localStorage.setItem('liftjudge_token', data.token); 
    			window.location.href = '/video_feed';
		} else {
			window.location.href = '/register.html'
		}
	});
    </script>
</body>
</html>
